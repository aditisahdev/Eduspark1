<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin – Eduspark enquiries</title>
<style>
:root{--blue:#0B5FBE;--navy:#0A1B4D;--tint:#EEF3FC;--line:#D9E2F0;--ink:#0A1B4D;--muted:#4B5C86;--ok:#1F8A4C;--warn:#B7791F}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--tint);color:var(--ink)}
button,input,select{font:inherit}
.hide{display:none!important}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:1rem}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:2rem;width:min(380px,100%);box-shadow:0 24px 50px -28px rgba(10,27,77,.5)}
.card h1{margin:0 0 .3rem;font-size:1.4rem}
.card p{margin:0 0 1.2rem;color:var(--muted)}
.card input{width:100%;padding:.8rem 1rem;border:1px solid var(--line);border-radius:12px;margin-bottom:.8rem;background:var(--tint)}
.card input:focus,.bar input:focus,.bar select:focus{outline:2px solid var(--blue);outline-offset:1px}
.btn{border:0;border-radius:999px;background:var(--blue);color:#fff;padding:.7rem 1.3rem;font-weight:600;cursor:pointer}
.btn:hover{background:#0A4FA0}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--blue)}
.err{color:#B42318;min-height:1.4em;margin:.2rem 0 .6rem;font-size:.9rem}
/* app */
header{background:#fff;border-bottom:1px solid var(--line);padding:.8rem 1.2rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:5}
header h1{font-size:1.1rem;margin:0;flex:1}
main{max-width:1280px;margin:0 auto;padding:1.2rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin-bottom:1rem}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:.9rem 1.1rem}
.stat b{display:block;font-size:1.7rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.85rem}
.bar{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
.bar input,.bar select{padding:.65rem 1rem;border:1px solid var(--line);border-radius:999px;background:#fff}
.bar input{flex:1 1 220px}
.wrap{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:.7rem .9rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);font-size:.9rem}
th{background:var(--tint);font-weight:600;position:sticky;top:0;white-space:nowrap}
tr:last-child td{border-bottom:0}
td a{color:var(--blue);text-decoration:none;font-weight:600}
td.msg{max-width:260px;color:var(--muted)}
td.when{white-space:nowrap;color:var(--muted)}
.pill{display:inline-block;padding:.1rem .6rem;border-radius:999px;background:var(--tint);color:var(--blue);font-size:.78rem;font-weight:600}
select.st{padding:.35rem .6rem;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600}
select.st.new{color:var(--blue)}select.st.contacted{color:var(--warn)}select.st.done{color:var(--ok)}
.del{background:none;border:0;color:#B42318;cursor:pointer;font-size:.85rem}
.empty{padding:2.5rem;text-align:center;color:var(--muted)}
@media(max-width:760px){
  .stats{grid-template-columns:repeat(2,1fr)}
  table,thead,tbody,tr,td{display:block;min-width:0}
  thead{display:none}
  tr{padding:.8rem 1rem;border-bottom:1px solid var(--line)}
  td{border:0;padding:.15rem 0;max-width:none!important}
  td::before{content:attr(data-l)": ";color:var(--muted);font-size:.8rem}
}
</style>
</head>
<body>
<section class="login" id="login">
  <form class="card" id="lf">
    <h1>Eduspark admin</h1>
    <p>Sign in to see enquiries.</p>
    <input type="email" id="em" placeholder="Email" autocomplete="username" required autofocus>
    <input type="password" id="pw" placeholder="Admin password" autocomplete="current-password" required>
    <div class="err" id="lerr" role="alert"></div>
    <button class="btn" style="width:100%" type="submit">Sign in</button>
  </form>
</section>

<div id="app" class="hide">
  <header>
    <h1>Eduspark enquiries</h1>
    <a class="btn ghost" id="csv" href="/api/admin/export.csv" style="text-decoration:none">Export CSV</a>
    <button class="btn" id="logout" type="button">Sign out</button>
  </header>
  <main>
    <div class="stats">
      <div class="stat"><b id="s-all">0</b><span>Total</span></div>
      <div class="stat"><b id="s-new">0</b><span>New</span></div>
      <div class="stat"><b id="s-contacted">0</b><span>Contacted</span></div>
      <div class="stat"><b id="s-done">0</b><span>Done</span></div>
    </div>
    <div class="bar">
      <input id="q" type="search" placeholder="Search name, phone, college, city…" aria-label="Search enquiries">
      <select id="f" aria-label="Filter by status"><option value="">All statuses</option><option value="new">New</option><option value="contacted">Contacted</option><option value="done">Done</option></select>
    </div>
    <div class="wrap">
      <table>
        <thead><tr><th>Received</th><th>Name</th><th>Phone</th><th>Email</th><th>College</th><th>City</th><th>Programme</th><th>Message</th><th>From</th><th>Status</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty hide" id="empty">No enquiries yet. They appear here as soon as someone submits the form on the website.</div>
    </div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const api = async (url, opt = {}) => {
  const r = await fetch(url, { credentials: "same-origin", headers: { "Content-Type": "application/json" }, ...opt });
  if (r.status === 401 && url !== "/api/admin/login") { show(false); throw new Error("auth"); }
  return r;
};
function show(inApp) { $("#login").classList.toggle("hide", inApp); $("#app").classList.toggle("hide", !inApp); if (inApp) load(); }

$("#lf").addEventListener("submit", async e => {
  e.preventDefault(); $("#lerr").textContent = "";
  const r = await fetch("/api/admin/login", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: $("#em").value, password: $("#pw").value }) });
  if (r.ok) { $("#pw").value = ""; show(true); } else $("#lerr").textContent = (await r.json().catch(() => ({}))).error || "Could not sign in";
});
$("#logout").onclick = async () => { await fetch("/api/admin/logout", { method: "POST", credentials: "same-origin" }); show(false); };

let t; $("#q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(load, 250); });
$("#f").addEventListener("change", load);

const cell = (tr, label, node, cls) => { const td = document.createElement("td"); td.dataset.l = label; if (cls) td.className = cls; td.append(node); tr.append(td); return td; };
const txt = s => document.createTextNode(s || "–");

async function load() {
  const qs = new URLSearchParams({ q: $("#q").value, status: $("#f").value });
  let data; try { data = await (await api("/api/admin/enquiries?" + qs)).json(); } catch { return; }
  const c = data.counts || {}, all = Object.values(c).reduce((a, b) => a + b, 0);
  $("#s-all").textContent = all; for (const k of ["new", "contacted", "done"]) $("#s-" + k).textContent = c[k] || 0;
  const body = $("#rows"); body.replaceChildren();
  $("#empty").classList.toggle("hide", data.rows.length > 0);
  for (const r of data.rows) {
    const tr = document.createElement("tr");
    cell(tr, "Received", txt(new Date(r.created_at.replace(" ", "T") + "Z").toLocaleString()), "when");
    cell(tr, "Name", txt(r.name));
    const pa = document.createElement("a"); pa.href = "tel:" + r.phone.replace(/[^0-9+]/g, ""); pa.textContent = r.phone; cell(tr, "Phone", pa);
    if (r.email) { const ea = document.createElement("a"); ea.href = "mailto:" + r.email; ea.textContent = r.email; cell(tr, "Email", ea); } else cell(tr, "Email", txt(""));
    cell(tr, "College", txt(r.college)); cell(tr, "City", txt(r.city)); cell(tr, "Programme", txt(r.course));
    cell(tr, "Message", txt(r.message), "msg");
    const src = document.createElement("span"); src.className = "pill"; src.textContent = r.source || "site"; cell(tr, "From", src);
    const sel = document.createElement("select"); sel.className = "st " + r.status; sel.setAttribute("aria-label", "Status");
    for (const s of ["new", "contacted", "done"]) { const o = document.createElement("option"); o.value = s; o.textContent = s[0].toUpperCase() + s.slice(1); if (s === r.status) o.selected = true; sel.append(o); }
    sel.onchange = async () => { await api("/api/admin/enquiries/" + r.id, { method: "PATCH", body: JSON.stringify({ status: sel.value }) }); load(); };
    cell(tr, "Status", sel);
    const d = document.createElement("button"); d.className = "del"; d.textContent = "Delete";
    d.onclick = async () => { if (confirm("Delete this enquiry from " + r.name + "?")) { await api("/api/admin/enquiries/" + r.id, { method: "DELETE" }); load(); } };
    cell(tr, "", d);
    body.append(tr);
  }
}
setInterval(() => { if (!$("#app").classList.contains("hide") && document.visibilityState === "visible") load(); }, 15000); // new enquiries show up by themselves
fetch("/api/admin/session", { credentials: "same-origin" }).then(r => show(r.ok)).catch(() => show(false));
</script>
</body>
</html>
